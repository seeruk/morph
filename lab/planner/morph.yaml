# yaml-language-server: $schema=../../schemas/config.schema.json
defaults:
  packages:
    output:
      strategy: single_package
    types:
      callables:
      - github.com/seeruk/morph/lab/planner/from.OtoO
      - github.com/seeruk/morph/lab/planner/from.OptionalOfString
      - github.com/seeruk/morph/lab/planner/from.Optional.Unwrap

conversions:
- source: github.com/seeruk/morph/lab/planner/to.Stringy
  targets:
  - string
  bidirectional: true
- source: int
  targets:
  - int64
  - int32
  bidirectional: true
- source: string
  targets:
  - github.com/seeruk/morph/lab/planner/to.RecipeID
  bidirectional: true

packages:
- source: github.com/seeruk/morph/lab/planner/from
  target: github.com/seeruk/morph/lab/planner/to
  bidirectional: true
  types:
  - name: Recipe
    mappers:
      forward:
        signature:
          accepts: pointer
    struct:
      properties:
      - source: RecipeId
        target: ID
        accessors:
          forward:
            read: RecipeId
            write: SetID
      omit:
        target:
        - Glorp
  - name: Single
  - source: Difficulty
    target: RecipeDifficulty
    enum:
      values:
        DifficultyUltra: RecipeDifficultyInsane

#- source: github.com/seeruk/morph/lab/planner/from
#  target: github.com/seeruk/morph/lab/planner/to
#  output:
#    strategy: target_package
#  types:
#  - name: Single

- source: github.com/seeruk/morph/lab/planner/from
  target: github.com/seeruk/morph/lab/planner/to
  bidirectional: true
  output:
    strategy: source_package
  types:
  - name: Single
  - name: Explicit
    struct:
      properties:
      - name: Foo
        callable:
          inverse: github.com/seeruk/morph/lab/planner/from.OptionalOfString2
