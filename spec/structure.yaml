# yaml-language-server: $schema=../schemas/config.schema.json
# Defaults allows you to specify default values for many configuration options. Defaults have the
# lowest precedence, so any options specified in presets, packages, or types will override these.
defaults:
  packages:
    types:
      enum:
        failureMode: error
      callables:
      - github.com/seeruk/nextmealplease/internal/numeric.CheckedInt32ToInt8
      bidirectional: true
      optionality:
        onNilSourcePointer: zero # or error
        onZeroSourceValue: address # or nil
    output:
      strategy: target_package    # Or source_package, or single_package
      path: internal/mapping      # Only relevant for single_package strategy
      package: mapping            # Only relevant for single_package strategy
      filename: mapping.morph.go  # Could also support formatting strings? e.g. <pkg>.morph.go

# Discovery configures broad package auto-discovery of mapping functions. This is ideal for if you
# already have a library of mapping functions between some commonly used types, and want every
# exported package-level function in those packages to be available.
#
# Morph also has some of its own packages which can be useful for discovery, ready to use. These are
# not included by default, so you're able to configure them as you see fit.
discovery:
  packages:
  - github.com/seeruk/nextmealplease/internal/optional
  exclusions:
  - github.com/seeruk/nextmealplease/internal/optional.OptionalPtr

# The types you want to map are defined here, grouped by a pair of packages, and then types within
# those packages. For packages which require minimal configuration otherwise, this is a very compact
# way to define mappings!
packages:
- source: github.com/seeruk/nextmealplease/internal/nmppb
  target: github.com/seeruk/nextmealplease/internal/nmp
  preset: protobuf
  mappers:
    forward:
      name: Map{{ .Target.Package }}{{ .Target.Type }}FromProto
  types:
  - source: Toughness
    target: Difficulty
    enum:
      failureMode: zero
      values:
        Toughness_TOUGHNESS_UNSPECIFIED: DifficultyUnknown # TODO: Can this be alleviated?
  - name: Unit
    enum:
      failureMode: error
      values:
        Unit_UNIT_UNSPECIFIED: UnitUnknown
  - name: Ingredient
  - name: Recipe
    struct:
      properties:
      - source: RecipeId
        target: ID
        callable:
          forward: github.com/seeruk/nextmealplease/internal/protomap.StringToID
          inverse: github.com/seeruk/nextmealplease/internal/protomap.IDToString

- source: github.com/seeruk/nextmealplease/internal/db
  target: github.com/seeruk/nextmealplease/internal/nmp
  bidirectional: true
  types:
  - name: Difficulty

# Presets are used to reduce repetition and noise elsewhere in the config. They can be applied to
# packages, or individual type-pairs. Preset options are available at the package or type level
# where applicable, and will be overridden by any more local options specified there.
presets:
  protobuf:
    bidirectional: true
    enum:
      failureMode: error
      patterns:
        source: "{{ .Type.Pascal }}_{{ .Type.Screaming }}_{{ .Value.Screaming }}"
        target: "{{ .Type.Pascal }}{{ .Value.Pascal }}"
    mappers:
      forward:
        name: Map{{ .Target.Package }}{{ .Target.Type }}FromProto
        signature:
          accepts: pointer
          returns: value
      inverse:
        name: Map{{ .Target.Package }}{{ .Target.Type }}ToProto
        signature:
          accepts: value
          returns: pointer
    optionality:
      onNilSourcePointer: zero
      onZeroSourceValue: address
